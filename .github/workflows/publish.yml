name: Publish packages

# Publishes @servantium/verdant + @servantium/grove to GitHub Packages on tag push.
# Consumer auto-notification was removed while the portal pipeline is being
# rewritten — consumers will pick up updates via manual PR or a future
# reintroduced notify-consumers job.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@servantium'

      - name: Install
        run: npm ci

      - name: Publish @servantium/verdant
        continue-on-error: true
        run: npm publish --workspace @servantium/verdant --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @servantium/grove
        continue-on-error: true
        run: npm publish --workspace @servantium/grove --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
