name: Publish + notify consumers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@servantium'

      - name: Install
        run: npm ci

      - name: Publish @servantium/verdant
        continue-on-error: true
        run: npm publish --workspace @servantium/verdant --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @servantium/grove
        continue-on-error: true
        run: npm publish --workspace @servantium/grove --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-consumers:
    # Fires regardless of publish success so even non-package changes (e.g. pure
    # CSS token tweaks where a package re-publish gets skipped) still propagate.
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        consumer:
          - servantium/servantium-website
          - servantium/servantium-help
    steps:
      - name: Dispatch update to ${{ matrix.consumer }}
        env:
          # Uses a fine-grained PAT stored as secret (DESIGN_SYSTEM_DISPATCH_PAT).
          # Must have: repo scope (contents, pull_requests) on website + help repos.
          GH_TOKEN: ${{ secrets.DESIGN_SYSTEM_DISPATCH_PAT }}
        run: |
          REF="${GITHUB_REF_NAME:-main}"
          echo "Dispatching ref=$REF to ${{ matrix.consumer }}"
          gh api \
            "/repos/${{ matrix.consumer }}/dispatches" \
            -X POST \
            -f event_type=design-system-updated \
            -F "client_payload[ref]=$REF"
