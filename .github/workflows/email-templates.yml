# Email templates → Postmark.
#
# The masters are packages/verdant-email/src/emails/*.mdx. This workflow compiles them and keeps
# Postmark in step, on the same rhythm engineering's backend already uses:
#
#   pull request   build + 33 checks; the rendered gallery is attached to the run for review
#   merge to main  sync email images to R2, push every template to the Postmark QA server
#   tag email-v*   sync email images to R2, push every template to the Postmark production server
#
# Images live at https://assets.servantium.com/brand/… (R2 bucket `servantium-assets`). URLs are
# stable, so replacing an image updates every email, including ones already sent.
#
# Postmark is a deployment target, never an editor: anything changed in Postmark's own UI is
# overwritten on the next push. Templates removed here are NOT deleted from Postmark — remove
# those by hand.
#
# Secrets: POSTMARK_SERVER_TOKEN_QA, POSTMARK_SERVER_TOKEN_PRODUCTION, CLOUDFLARE_API_TOKEN (R2 write
# on the one bucket), CLOUDFLARE_ACCOUNT_ID. NOT YET RUN — nothing here has executed.

name: Email templates

on:
  pull_request:
    paths: ['packages/verdant-email/**', 'packages/brand/**']
  push:
    branches: [main]
    tags: ['email-v*']
    paths: ['packages/verdant-email/**', 'packages/brand/**']
  workflow_dispatch:

env:
  ASSET_BASE: https://assets.servantium.com/brand

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run build --workspace @servantium/verdant-email
      - run: npm test --workspace @servantium/verdant-email
      - uses: actions/upload-artifact@v4
        with:
          name: email-templates
          path: packages/verdant-email/dist

  qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN_QA }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: email-templates, path: dist }
      - uses: actions/checkout@v4
        with: { sparse-checkout: packages/verdant-email/scripts, path: repo }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Sync email images to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd dist/assets
          for f in $(find logo astro email -type f); do
            npx --yes wrangler r2 object put "servantium-assets/brand/$f" --file "$f" --remote --cache-control "public, max-age=86400"
          done
      - run: cp -r dist repo/packages/verdant-email/dist && node repo/packages/verdant-email/scripts/postmark-validate.mjs
      - run: npx --yes postmark-cli templates push dist/postmark --force --all

  production:
    if: startsWith(github.ref, 'refs/tags/email-v')
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN_PRODUCTION }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: email-templates, path: dist }
      - uses: actions/checkout@v4
        with: { sparse-checkout: packages/verdant-email/scripts, path: repo }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Sync email images to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd dist/assets
          for f in $(find logo astro email -type f); do
            npx --yes wrangler r2 object put "servantium-assets/brand/$f" --file "$f" --remote --cache-control "public, max-age=86400"
          done
      - run: cp -r dist repo/packages/verdant-email/dist && node repo/packages/verdant-email/scripts/postmark-validate.mjs
      - run: npx --yes postmark-cli templates push dist/postmark --force --all
