# Email templates → Postmark.
#
# The masters are packages/verdant-email/src/emails/*.mdx. This workflow compiles them and keeps
# Postmark in step. See packages/verdant-email/docs/how-it-works.md.
#
#   pull request   build + tests; the rendered gallery is attached to the run for review
#   merge to main  push every template to the Postmark QA server
#   tag email-v*   sync brand images to R2, then push every template to the Postmark production server
#
# Images are synced on the production tag only. Their URLs never change, so a new image reaches
# every email already sent the moment it's uploaded. That makes an image change a production
# change, and it waits for the tag like one. QA templates load the same production images.
#
# Postmark is a deployment target, never an editor: anything changed in Postmark's own UI is
# overwritten on the next push. Templates removed here are NOT deleted from Postmark — remove
# those by hand.
#
# OFF until engineering switches it on: the QA and production jobs run only when the repository
# variable EMAIL_DEPLOY is `on`. Before that, set these secrets:
#   POSTMARK_SERVER_TOKEN_QA, POSTMARK_SERVER_TOKEN_PRODUCTION   (one Postmark server token each)
#   CLOUDFLARE_API_TOKEN   (R2 object read & write on the servantium-assets bucket only)
#   CLOUDFLARE_ACCOUNT_ID
# and give the `production` environment required reviewers.

name: Email templates

on:
  pull_request:
    paths: ['packages/verdant-email/**', 'packages/brand/**', '.github/workflows/email-templates.yml']
  push:
    branches: [main]
    tags: ['email-v*']
    paths: ['packages/verdant-email/**', 'packages/brand/**']
  workflow_dispatch:

env:
  ASSET_BASE: https://assets.servantium.com/brand

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run build --workspace @servantium/verdant-email
      - run: npm test --workspace @servantium/verdant-email
      - uses: actions/upload-artifact@v4
        with:
          name: email-templates
          path: packages/verdant-email/dist

  qa:
    if: vars.EMAIL_DEPLOY == 'on' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN_QA }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: email-templates, path: dist }
      - uses: actions/checkout@v4
        with: { sparse-checkout: packages/verdant-email/scripts, path: repo }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cp -r dist repo/packages/verdant-email/dist && node repo/packages/verdant-email/scripts/postmark-validate.mjs
      - run: npx --yes postmark-cli templates push dist/postmark --force --all

  production:
    if: vars.EMAIL_DEPLOY == 'on' && startsWith(github.ref, 'refs/tags/email-v')
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN_PRODUCTION }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: email-templates, path: dist }
      - uses: actions/checkout@v4
        with: { sparse-checkout: packages/verdant-email/scripts, path: repo }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Sync brand images to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd dist/assets
          for f in $(find logo astro email social -type f); do
            case "$f" in *.png) type=image/png ;; *.jpg) type=image/jpeg ;; *) echo "skipping $f"; continue ;; esac
            npx --yes wrangler r2 object put "servantium-assets/brand/$f" --file "$f" --remote \
              --content-type "$type" --cache-control "public, max-age=86400"
          done
      - run: cp -r dist repo/packages/verdant-email/dist && node repo/packages/verdant-email/scripts/postmark-validate.mjs
      - run: npx --yes postmark-cli templates push dist/postmark --force --all
