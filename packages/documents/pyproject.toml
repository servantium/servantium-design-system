[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servantium-documents"
version = "0.2.0"
description = "Servantium decks, documents and workbooks, generated from a checked spec on the brand templates."
requires-python = ">=3.11"
dependencies = [
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pillow>=10",
  "lxml>=5",
  "fonttools>=4.50",
  "pyyaml>=6",
  "jsonschema>=4.20",
  "pymupdf>=1.24",
]

[project.scripts]
sv = "servantium_documents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
servantium_documents = ["assets/icons/*", "schema/*.json", "banned.txt"]
