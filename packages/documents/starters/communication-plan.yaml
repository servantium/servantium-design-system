# Communication plan: the meeting rhythm, what each forum decides, what the reports hold, how fast problems escalate, where records live and who receives what.
#
# Agreed at kickoff and attached to the charter. Every forum has an owner, an output and a
# cadence. The escalation table says who hears about a problem, from whom, and within how long.
document: {{NAME}}
client: {{CLIENT}}
brand: {{BRAND}}
page_numbers: x_of_y
footer: "Communication plan  ·  {{CLIENT}}  ·  Confidential"
# prepared_for: {name: {{CLIENT}}, logo: client-logo.png}
cover:
  eyebrow: "{{CLIENT}}  ·  <Project>"
  title: Communication plan
  subtitle: When we talk, who is in the room, what each meeting decides, and how fast a problem reaches the right person.
  meta:
    - [Project, <Project ID>]
    - [Owner, <Project manager>]
    - [Agreed, <Kickoff date>]
body:
  - h1: The rhythm
  - table:
      head: [Forum, Who, Purpose, When, Output]
      widths: [1.3, 1.6, 1.7, 1.1, 1.3]
      size: 9.5
      rows:
        - [Status call, <Both project managers>, "<Progress, RAID and next week>", "<Weekly, day and time>", <Written status report>]
        - [Working session, <The people doing the work>, <Design and test decisions>, <As needed>, <Decisions in the RAID log>]
        - [Steering committee, <Sponsors>, "<Milestones, change orders, escalations>", <Monthly>, <Decisions and actions>]
        - [Monthly report, <Distribution list>, <The month in writing>, <By the Nth working day>, <PDF in the project folder>]

  - h2: Who attends from {{CLIENT}}
  - bullets:
      - "**Status call:** <names>."
      - "**Steering committee:** <names>."

  - h1: What the monthly report holds
  - numbered:
      - Overall status color and the one fact behind it.
      - Milestones against plan, with forecast or actual dates.
      - Hours and billing against plan.
      - Open risks, issues and decisions needed, each with an owner.
      - What happens next month.

  - h1: When something goes wrong
  - table:
      head: [Level, Example, We tell, Within, Decides]
      widths: [0.9, 2.3, 1.5, 1.0, 1.3]
      size: 9.5
      rows:
        - [1, <A task slips but the milestone holds>, <Their project manager>, <Next status call>, <Project managers>]
        - [2, <A milestone is at risk>, <Business owner>, <One business day>, <Business owner>]
        - [3, <Go-live or budget at risk>, <Executive sponsor>, <Same day>, <Steering committee>]
  - callout: {label: "Our rule:", text: "<We bring options with every problem, priced at contract rates when money is involved.>"}

  - h1: Channels and records
  - table:
      head: [What, Where, Kept by]
      widths: [2.4, 3.0, 1.6]
      rows:
        - [Status reports, <Folder or tool>, <Name>]
        - [RAID log, <Folder or tool>, <Name>]
        - [Decisions and change orders, <Folder or tool>, <Name>]
        - [Day-to-day questions, <Channel>, <Both teams>]

  - h1: Distribution list
  - table:
      head: [Name, Company, Role, Receives]
      widths: [1.6, 1.4, 1.8, 2.2]
      rows:
        - [<Name>, "{{CLIENT}}", <Executive sponsor>, "<Monthly report, steering pack>"]
        - [<Name>, "{{CLIENT}}", <Business owner>, "<Weekly status, monthly report>"]
        - [<Name>, <Provider>, <Project manager>, <Everything>]
